services:
  - type: web
    name: sniplink-api
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: sniplink-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BASE_URL
        value: https://sniplink-api.onrender.com 
      - key: CORS_ORIGIN
        sync: false
    rootDir: backend

  - type: worker
    name: sniplink-click-worker
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run worker:click
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sniplink-db
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
    rootDir: backend

databases:
  - name: sniplink-db
    plan: free
